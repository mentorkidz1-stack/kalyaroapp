services:
  - type: web
    name: kalyaro-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate --schema apps/api/prisma/schema.prisma && npm run build --workspace packages/shared && npm run build --workspace packages/ai-service && npm run build --workspace apps/api
    startCommand: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && npm run start --workspace apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_ORIGIN
        value: https://kalyaro-web.onrender.com
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: ANTHROPIC_API_KEY
        value: ""
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: kalyaro-uploads

  - type: web
    name: kalyaro-web
    runtime: static
    buildCommand: npm install && npm run build --workspace packages/shared && npm run build --workspace apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://kalyaro-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
